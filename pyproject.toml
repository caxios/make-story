[project]
name = "storyweaver"
version = "0.1.0"
description = "Multi-agent long-form fiction generation with LangGraph and Gemini"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langgraph",
    "langchain-google-genai",
    "pydantic>=2.0",
    "chromadb",
    "streamlit",
    "python-dotenv",
    "python-docx",
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
