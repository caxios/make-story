# StoryWeaver — a writing desk, not a dashboard.
#
# This file is what actually themes the app. Streamlit renders every widget
# (inputs, tabs, expanders, sliders) with the theme defined here; CSS alone
# cannot reach them, so styling the page background without this leaves light
# widgets stranded on a dark page.
#
# Both palettes below are checked for WCAG AA contrast (4.5:1) on every
# text/surface pair, so the app is readable whichever appearance the viewer
# picks from Streamlit's own menu.

[theme]
base = "dark"

# `Name:URL` tells Streamlit to load the stylesheet and use the family. If the
# network is unavailable it falls straight through to the system stack.
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap, Pretendard, system-ui, -apple-system, Segoe UI, sans-serif"
headingFont = "Inter, Pretendard, system-ui, -apple-system, Segoe UI, sans-serif"
codeFont = "ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"

baseRadius = "0.5rem"
buttonRadius = "0.5rem"
showWidgetBorder = true
showSidebarBorder = true


# --- Dark: warm near-black paper, amber ink -------------------------------

[theme.dark]
primaryColor = "#E0A951"            # amber — buttons, focus rings, accents
backgroundColor = "#17140F"         # the page
secondaryBackgroundColor = "#221D16"  # inputs, expanders, panels
textColor = "#EFE8DB"               # 15.1:1 on the page
linkColor = "#E8B96A"
borderColor = "#453B2D"
codeBackgroundColor = "#100E0A"
codeTextColor = "#E3D9C4"

greenColor = "#8FBE6E"
greenTextColor = "#8FBE6E"
redColor = "#E08078"
redTextColor = "#E08078"
orangeColor = "#E3A45E"
orangeTextColor = "#E3A45E"
yellowColor = "#DFC366"
yellowTextColor = "#DFC366"
grayColor = "#A99D8A"
grayTextColor = "#A99D8A"

# Charts, if any page ever grows one.
chartCategoricalColors = [
  "#E0A951", "#8FBE6E", "#7FA8C9", "#E08078", "#C79AD1", "#D9B98C",
]

[theme.dark.sidebar]
backgroundColor = "#1D1912"
secondaryBackgroundColor = "#272117"
borderColor = "#453B2D"


# --- Light: warm paper, ink brown -----------------------------------------

[theme.light]
primaryColor = "#845808"
backgroundColor = "#FBF7EF"
secondaryBackgroundColor = "#F2EBDD"
textColor = "#241E16"               # 15.4:1 on the page
linkColor = "#7A5209"
borderColor = "#D0C2A6"
codeBackgroundColor = "#EFE7D7"
codeTextColor = "#3A3026"

greenColor = "#4A6B33"
greenTextColor = "#4A6B33"
redColor = "#9A3B33"
redTextColor = "#9A3B33"
orangeColor = "#8A5A17"
orangeTextColor = "#8A5A17"
yellowColor = "#7A6008"
yellowTextColor = "#7A6008"
grayColor = "#6B5F4C"
grayTextColor = "#6B5F4C"

chartCategoricalColors = [
  "#845808", "#4A6B33", "#2F5C7A", "#9A3B33", "#6B4A80", "#8A6F45",
]

[theme.light.sidebar]
backgroundColor = "#F5EFE3"
secondaryBackgroundColor = "#EBE2D0"
borderColor = "#D0C2A6"


[server]
headless = true

[browser]
gatherUsageStats = false
